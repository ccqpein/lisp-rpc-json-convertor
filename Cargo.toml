[package]
name = "lisp-rpc-json-convertor"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter"] }
lisp-rpc-rust-raw-data = "0"
serde_json = "1"
